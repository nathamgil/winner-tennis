<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel · Winner Tennis</title>
<meta name="robots" content="noindex">
<link rel="icon" href="fotos/logo-winner.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/estilo.css?v=20261031153626">
<link rel="stylesheet" href="assets/admin.css?v=20261031153626">
</head>
<body class="adm">
<div class="demo-faixa"><b>Modo demonstração.</b> Alunos, inscrições, placares e reservas de exemplo, guardados só neste aparelho.</div>
<header class="adm-topo">
  <div class="wrap">
    <a class="marca" href="index.html"><img src="fotos/logo-winner.jpg" alt="" width="44" height="44"><span>Winner<small>Painel da academia</small></span></a>
    <div class="sp">
      <a class="btn btn-pq btn-vazado" href="index.html" target="_blank" rel="noopener">Ver site</a>
      <button class="btn btn-pq btn-vazado" id="adm-sair" type="button" hidden>Sair</button>
    </div>
  </div>
</header>

<section id="v-login">
  <div class="wrap">
    <div class="login">
      <span class="rotulo" style="color:var(--saibro)">Painel da Winner</span>
      <h1 style="font-size:clamp(44px,8vw,72px);margin:12px 0 24px">Entrar</h1>
      <form class="form" id="form-adm" novalidate>
        <div class="campos">
          <label class="cheio">Usuário<input id="adm-u" autocomplete="username" autocapitalize="none"></label>
          <label class="cheio">Senha<input id="adm-s" type="password" autocomplete="current-password"></label>
        </div>
        <button class="btn" type="submit">Entrar</button>
        <div id="adm-msg" role="alert"></div>
        <div class="cred">
          <b>Login da demonstração</b><br><span id="cred-admin"></span><br>
          <button class="btn btn-pq btn-vazado" id="preencher-admin" type="button">Preencher</button>
        </div>
      </form>
    </div>
  </div>
</section>

<div id="v-painel" class="adm-grade" hidden>
  <nav class="adm-nav" aria-label="Seções do painel">
    <button type="button" data-aba="geral">Visão geral <span class="cont" hidden></span></button>
    <button type="button" data-aba="alunos">Alunos e turmas</button>
    <button type="button" data-aba="inscricoes">Inscrições e chaves <span class="cont" hidden></span></button>
    <button type="button" data-aba="ranking">Ranking</button>
    <button type="button" data-aba="avisos">Avisos</button>
    <button type="button" data-aba="reservas">Reservas de quadra <span class="cont" hidden></span></button>
    <button type="button" data-aba="ajustes">Ajustes</button>
  </nav>
  <main class="adm-main" id="adm-main" tabindex="-1"></main>
</div>

<dialog id="dlg" aria-label="Detalhe"><div id="dlg-corpo"></div></dialog>

<script src="assets/config.js?v=20261031153626"></script>
<script src="assets/dados.js?v=20261031153626"></script>
<script src="assets/admin.js?v=20261031153626"></script>
</body>
</html>
